<header class="header">
  <div class="logo">
    RentHub
  </div>

  <nav class="nav">
    <a routerLink="/">Home</a>
    @if (isAdmin$ | async) {
      <a routerLink="/create-post">Create Post</a>
    }
    @if (isLoggedIn$ | async) {
    <button type="button" class="btn btn-outline-danger" (click)="logout()">
      Logout
    </button>
    } @else {
    <a routerLink="/login">
      Login
    </a>
    }
  </nav>
</header>
